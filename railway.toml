[build]
builder = "dockerfile"
dockerfilePath = "Dockerfile"

# ── API service (default) ─────────────────────────────────────────────────────
[deploy]
startCommand = "node dist/index.js"
restartPolicyType = "on_failure"
restartPolicyMaxRetries = 3
healthcheckPath = "/health"
healthcheckTimeout = 10
